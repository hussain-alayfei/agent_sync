<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>استوديو زيد — غرفة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a1a; --muted:#6b6b6b; --rule:#dcdcdc; --soft:#f5f5f4; --accent:#b3261e; --ok:#1e7a3c; --warn:#a86400; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Almarai',system-ui,sans-serif; color:var(--ink); background:#fff; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:12px 24px; border-bottom:1px solid var(--rule); }
  header h1 { font-size:18px; margin:0; }
  #state { font-size:13px; padding:3px 10px; border:1px solid var(--rule); }
  #state.live { background:var(--accent); color:#fff; border-color:var(--accent); }
  #state.ready { color:var(--ok); border-color:var(--ok); }
  .sp { margin-inline-start:auto; }
  main { padding:20px 24px; display:grid; gap:22px; max-width:1200px; }
  button { font:inherit; font-size:14px; padding:7px 16px; border:1px solid var(--ink); background:#fff; color:var(--ink); cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; }
  button.danger { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.35; cursor:default; }
  input, textarea { font:inherit; font-size:14px; border:1px solid var(--rule); padding:7px 9px; }
  .cols { display:grid; grid-template-columns:repeat(3, 1fr); gap:0; border:1px solid var(--rule); }
  .cols > div { padding:12px 14px; min-height:92px; border-inline-start:1px solid var(--rule); }
  .cols > div:first-child { border:0; }
  .cols h2 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:400; }
  .cols .big { font-size:17px; font-weight:700; }
  .cols .sub { font-size:12px; color:var(--muted); margin-top:4px; }
  #now { background:#fff5f4; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:7px 8px; border-bottom:1px solid var(--rule); text-align:right; vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:400; }
  td.num { font-variant-numeric:tabular-nums; direction:ltr; text-align:left; white-space:nowrap; }
  .chip { display:inline-block; font-size:12px; padding:1px 8px; border:1px solid var(--rule); }
  .chip.on_air { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.ready { color:var(--ok); border-color:var(--ok); }
  .chip.preparing { color:var(--warn); border-color:var(--warn); }
  .chip.done { color:var(--muted); }
  .chip.blocked { text-decoration:line-through; color:var(--accent); }
  .chip.breaking { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.withdrawn { color:var(--accent); border-color:var(--accent); }
  .chip.draft { color:var(--warn); border-color:var(--warn); }
  tr.played td { color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  form { display:grid; gap:8px; border:1px solid var(--rule); padding:14px; }
  form textarea { min-height:80px; width:100%; }
  #log { font-size:12px; color:var(--muted); max-height:220px; overflow:auto; border:1px solid var(--rule); padding:8px 10px; line-height:1.8; }
  #msg { font-size:13px; min-height:18px; }
  #msg.bad { color:var(--accent); }
  h3 { font-size:15px; margin:0 0 8px; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } .cols > div { border:0; border-top:1px solid var(--rule); } }
</style>
</head>
<body>
<header>
  <h1>استوديو زيد</h1>
  <span id="state">…</span>
  <span id="setup" style="font-size:12px;color:var(--muted)"></span>
  <span class="sp"></span>
  <button id="clear">مسح النشرة</button>
  <button id="reset">ديمو (3 أخبار)</button>
  <button id="prepare">تجهيز الاستوديو</button>
  <button id="golive" class="primary">على الهواء</button>
  <button id="end" class="danger">إنهاء البث</button>
  <a href="/watch" target="_blank" style="font-size:13px;color:var(--ink)">صفحة المشاهد ↗</a>
  <a href="/admin" style="font-size:13px;color:var(--ink)">الإعدادات</a>
</header>
<main>
  <div id="msg"></div>
  <section class="cols">
    <div id="now"><h2>على الهواء الآن</h2><div class="big" id="c-now">—</div><div class="sub" id="c-now-sub"></div></div>
    <div><h2>التالي جاهز</h2><div class="big" id="c-next">—</div><div class="sub" id="c-next-sub"></div></div>
    <div><h2>قيد التجهيز</h2><div class="big" id="c-prep">—</div><div class="sub" id="c-prep-sub"></div></div>
  </section>

  <section>
    <h3>ترتيب النشرة (Rundown)</h3>
    <table>
      <thead><tr><th>#</th><th>العنوان</th><th>النوع</th><th>الاعتماد</th><th>النسخة</th><th>حالة البث</th><th>طول الصوت</th><th>وقت التجهيز</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <form id="form">
    <h3 id="form-title">خبر جديد</h3>
    <input type="hidden" id="f-id">
    <input id="f-headline" placeholder="العنوان" required>
    <textarea id="f-script" placeholder="النص الذي يقرؤه زيد حرفياً" required></textarea>
    <div class="row">
      <label><input type="checkbox" id="f-breaking"> خبر عاجل</label>
      <label><input type="checkbox" id="f-approve" checked> اعتماد مباشرة</label>
      <button class="primary" type="submit" id="f-save">حفظ</button>
      <button type="button" id="f-cancel">إلغاء</button>
    </div>
  </form>

  <section>
    <h3>سجل البث</h3>
    <div id="log"></div>
  </section>
</main>

<script type="module">
const $ = id => document.getElementById(id)

const STATE_AR = { queued: 'بالانتظار', preparing: 'قيد التجهيز', ready: 'جاهز', on_air: 'على الهواء', done: 'انقرأ', blocked: 'ممنوع' }
const STATUS_AR = { draft: 'مسودة', approved: 'معتمد', withdrawn: 'مسحوب' }
const CTRL_AR = { idle: 'متوقف', preparing: 'يجهّز', ready: 'جاهز للبث', live: 'على الهواء', ended: 'انتهى' }
const PRESENTER_AR = { ready: 'زيد متصل', starting: 'زيد يشتغل…', waiting: 'مفاتيح LiveKit ناقصة', crashed: 'زيد متوقف، يعيد التشغيل', stopped: 'زيد متوقف' }
let segments = [], control = {}

function msg (t, bad) { $('msg').textContent = t; $('msg').className = bad ? 'bad' : '' }
async function api (method, path, body) {
  const r = await fetch('/api/v1' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  if (r.status === 401) { location.assign('/admin?next=/studio'); throw new Error('login') }
  const j = r.status === 204 ? null : await r.json()
  if (!r.ok) { msg(j?.error || r.statusText, true); throw new Error(j?.error) }
  return j
}

async function setup () {
  const s = await api('GET', '/status')
  $('setup').textContent = `LiveKit: ${s.services.livekit ? 'جاهز' : 'غير مضبوط'} · ElevenLabs: ${s.services.elevenlabs ? 'جاهز' : 'غير مضبوط'} · Runway: ${s.services.runway ? 'جاهز' : 'غير مضبوط (صوت فقط)'}`
  return s
}

function render (presenter) {
  $('state').textContent = (CTRL_AR[control.state] || control.state || '…') + (presenter ? ' · ' + (PRESENTER_AR[presenter.state] || presenter.state) : '')
  $('state').className = control.state || ''
  const sorted = [...segments].sort((a, b) => a.position - b.position)
  const live = sorted.find(s => s.playback_state === 'on_air')
  const upcoming = sorted.filter(s => s.status === 'approved' && !['done', 'blocked', 'on_air'].includes(s.playback_state))
  const prep = sorted.filter(s => s.playback_state === 'preparing')
  $('c-now').textContent = live ? live.headline : '—'
  $('c-now-sub').textContent = live ? `#${live.id} · نسخة ${live.version}${live.kind === 'breaking' ? ' · عاجل' : ''}` : (control.note || '')
  $('c-next').textContent = upcoming[0] ? upcoming[0].headline : '—'
  $('c-next-sub').textContent = upcoming[0] ? (upcoming[0].playback_state === 'ready' ? `جاهز · ${(upcoming[0].audio_ms / 1000).toFixed(1)} ث` : STATE_AR[upcoming[0].playback_state]) : ''
  $('c-prep').textContent = prep.length ? prep.map(s => s.headline).join('، ') : '—'
  $('c-prep-sub').textContent = prep.length ? 'يتولّد الصوت الآن' : ''
  $('rows').innerHTML = ''
  for (const s of sorted) {
    const tr = document.createElement('tr')
    if (['done', 'blocked'].includes(s.playback_state)) tr.className = 'played'
    tr.innerHTML = `<td class="num">${s.id}</td><td></td>
      <td>${s.kind === 'breaking' ? '<span class="chip breaking">عاجل</span>' : 'عادي'}</td>
      <td><span class="chip ${s.status}">${STATUS_AR[s.status]}</span></td>
      <td class="num">v${s.version}${s.prepared_version && s.prepared_version !== s.version ? ` (الصوت v${s.prepared_version})` : ''}</td>
      <td><span class="chip ${s.playback_state}">${STATE_AR[s.playback_state]}</span></td>
      <td class="num">${s.audio_ms ? (s.audio_ms / 1000).toFixed(1) + ' s' : '—'}</td>
      <td class="num">${s.prepare_ms ? (s.prepare_ms / 1000).toFixed(1) + ' s' : '—'}</td>
      <td class="row"></td>`
    tr.children[1].textContent = s.headline
    const actions = tr.lastElementChild
    const played = ['done', 'blocked', 'on_air'].includes(s.playback_state)
    if (!played && s.status !== 'approved') actions.append(btn('اعتماد', () => api('POST', `/segments/${s.id}/approve`)))
    if (!played && s.status !== 'withdrawn') actions.append(btn('سحب', () => api('POST', `/segments/${s.id}/withdraw`), 'danger'))
    if (!played) actions.append(btn('تعديل', async () => edit(s)))
    if (s.playback_state !== 'on_air' && control.state !== 'live') actions.append(btn('حذف', () => api('DELETE', `/segments/${s.id}`)))
    $('rows').append(tr)
  }
}
function btn (label, fn, cls = '') { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.className = cls; b.onclick = () => fn().catch(() => {}); return b }

function edit (s) {
  $('form-title').textContent = `تعديل #${s.id} (أي تغيير في النص = نسخة جديدة تحتاج اعتماد)`
  $('f-id').value = s.id; $('f-headline').value = s.headline; $('f-script').value = s.script
  $('f-breaking').checked = s.kind === 'breaking'; $('f-breaking').disabled = true
  $('f-headline').focus()
}
function clearForm () { $('form').reset(); $('f-id').value = ''; $('f-breaking').disabled = false; $('form-title').textContent = 'خبر جديد'; $('f-approve').checked = true }
$('f-cancel').onclick = clearForm
$('form').onsubmit = async e => {
  e.preventDefault()
  const id = $('f-id').value ? Number($('f-id').value) : null
  const headline = $('f-headline').value.trim(), script = $('f-script').value.trim()
  const status = $('f-approve').checked ? 'approved' : undefined
  try {
    let seg
    if (id) seg = await api('PATCH', `/segments/${id}`, { headline, script, status })
    else if ($('f-breaking').checked) seg = await api('POST', '/breaking', { headline, script })
    else seg = await api('POST', '/segments', { headline, script, status: status || 'draft' })
    msg(id ? `انحفظ #${seg.id}` : `انضاف #${seg.id}${$('f-breaking').checked && control.state === 'live' ? ' — المخرج بيدخله بعد الخبر الحالي' : ''}`)
    clearForm()
  } catch {}
}

$('clear').onclick = () => confirm('مسح كل أخبار النشرة؟') && api('POST', '/rundown/clear').then(() => msg('انمسحت النشرة')).catch(() => {})
$('reset').onclick = () => api('POST', '/rundown/demo').then(() => msg('رجعت النشرة لثلاث أخبار معتمدة')).catch(() => {})
$('prepare').onclick = () => api('POST', '/broadcast/prepare', {}).then(() => msg('زيد دخل الاستوديو ويجهّز صوت الافتتاح…')).catch(() => {})
$('golive').onclick = () => api('POST', '/broadcast/live').then(r => msg(r.state === 'live' ? 'على الهواء' : 'بيطلع على الهواء أول ما يجهز الافتتاح')).catch(() => {})
$('end').onclick = () => api('POST', '/broadcast/end').then(() => msg('انتهى البث، زيد يقفل الجلسات')).catch(() => {})

const logLines = []
function logLine (x) { return `${new Date(x.at).toLocaleTimeString('ar-LB')} — ${x.event}${x.segment_id ? ' #' + x.segment_id : ''}${x.version ? ' v' + x.version : ''}${x.detail && Object.keys(x.detail).length ? ' ' + JSON.stringify(x.detail) : ''}` }
function renderLog () { $('log').textContent = ''; for (const l of logLines.slice(0, 80)) { const d = document.createElement('div'); d.textContent = l; $('log').append(d) } }

await setup()
for (const x of await api('GET', '/log?limit=60')) logLines.push(logLine(x))
renderLog()
const es = new EventSource('/api/v1/events')
es.addEventListener('rundown', e => { const d = JSON.parse(e.data); segments = d.segments; control = d.control; render(d.presenter) })
es.addEventListener('log', e => { logLines.unshift(logLine(JSON.parse(e.data))); renderLog() })
es.onerror = () => { msg('انقطع الاتصال بالخادم، يحاول يرجع…', true); setTimeout(() => setup().then(() => msg('')).catch(() => {}), 3000) }
setInterval(() => setup().catch(() => {}), 15000)
</script>
</body>
</html>
